name: CI

# Kept deliberately low-frequency: main-branch pushes, PRs, and a weekly
# scheduled run to catch dependency/image rot. Not per-branch, not per-commit.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The frontend build produces server/static/, which rust-embed embeds at
      # compile time — so it MUST run before any cargo step on a fresh checkout
      # (server/static/ is gitignored build output).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend build (produces server/static/)
        run: ./scripts/build-frontend.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: rustfmt
        run: cargo fmt --manifest-path server/Cargo.toml --check

      - name: clippy
        run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: tests
        run: cargo test --locked --manifest-path server/Cargo.toml

  # Weekly only: vendored PCRE2 source never updates itself, so audit for
  # advisories (Rust crates + rust-embed/pcre2-sys) on the scheduled run.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file server/Cargo.lock
